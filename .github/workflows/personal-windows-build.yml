name: Personal Windows Build

on:
  push:
    branches: [personal-self-hosted]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Download pinned CloakBrowser Chromium 146
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '146.0.7680.177.4'
          $url = "https://github.com/CloakHQ/CloakBrowser/releases/download/chromium-v$version/cloakbrowser-windows-x64.zip"
          $zip = Join-Path $env:RUNNER_TEMP 'cloakbrowser-windows-x64.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip
          New-Item -ItemType Directory -Force -Path 'resources/cloakbrowser-windows-x64' | Out-Null
          Expand-Archive -Path $zip -DestinationPath 'resources/cloakbrowser-windows-x64' -Force
          if (-not (Test-Path 'resources/cloakbrowser-windows-x64/chrome.exe')) {
            throw 'CloakBrowser archive did not contain chrome.exe at the expected path.'
          }
          & 'resources/cloakbrowser-windows-x64/chrome.exe' --version

      - name: Build application
        run: npm run build

      - name: Package Windows x64 installer
        run: npx electron-builder --win --x64

      - name: Package Windows x64 portable
        run: npx electron-builder --win --x64 --config.win.target=portable

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: TianHu6Jin-Personal-Windows-x64
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14
